<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antimicrobial Flashcards</title>
<style>
  :root{
    --bg:#eef1e9;
    --paper:#fffdf8;
    --ink:#182420;
    --sub:#5c6b62;
    --line:#dde3d5;
    --teal:#1f6f54;
    --teal-deep:#12503b;
    --teal-soft:#e2efe7;
    --rust:#b5541f;
    --rust-soft:#f8e8dc;
  }
  *{box-sizing:border-box;}
  html{height:auto;}
  body{
    margin:0;
    font-family:"Leelawadee UI","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    min-height:100vh;
    height:auto;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 48px;
    background:
      radial-gradient(circle at 12% 8%, rgba(31,111,84,.05), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(181,84,31,.05), transparent 45%),
      var(--bg);
  }

  #topbar{
    width:100%; max-width:680px;
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:18px; gap:12px; flex-wrap:wrap;
  }
  #brand{display:flex; align-items:center; gap:10px;}
  #brand svg{flex-shrink:0;}
  #brand h1{
    margin:0; font-family:Georgia,"Noto Serif Thai",serif;
    font-weight:700; font-size:22px; letter-spacing:.2px; color:var(--teal-deep);
  }
  #brand span{
    display:block; font-size:11.5px; color:var(--sub); margin-top:2px; font-weight:500;
  }
  #back-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--sub);
    font-size:12px; padding:7px 14px; border-radius:20px; cursor:pointer; font-family:inherit; transition:.15s;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  #back-btn:hover{border-color:var(--teal); color:var(--teal-deep);}

  #restart-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--sub);
    font-size:12px; padding:7px 14px; border-radius:20px; cursor:pointer;
    font-family:inherit; transition:.15s;
  }
  #restart-btn:hover{border-color:var(--teal); color:var(--teal-deep);}

  #stats{width:100%; max-width:680px; margin-bottom:8px; display:flex; gap:8px; flex-wrap:wrap;}
  .stat-pill{
    font-size:11.5px; padding:5px 12px; border-radius:20px;
    background:var(--paper); border:1px solid var(--line); color:var(--sub);
  }
  .stat-pill b{
    font-family:"Consolas","IBM Plex Mono",monospace; color:var(--ink); font-weight:600; font-size:12.5px;
  }

  #mastery{width:100%; max-width:680px; margin-bottom:22px;}
  #mastery .label{
    font-size:11px; color:var(--sub); margin-bottom:5px;
    display:flex; justify-content:space-between;
  }
  #mastery .track{
    height:7px; border-radius:20px; background:var(--rust-soft);
    overflow:hidden; border:1px solid var(--line);
  }
  #mastery .fill{
    height:100%; background:linear-gradient(90deg,var(--teal),var(--teal-deep));
    width:0%; transition:width .4s ease;
  }

  #card{
    position:relative;
    width:100%; max-width:680px;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:5px solid var(--teal);
    border-radius:18px;
    padding:34px 30px 28px;
    min-height:270px;
    display:flex; flex-direction:column;
    box-shadow:0 1px 2px rgba(23,45,35,.04), 0 12px 28px -18px rgba(23,45,35,.25);
    overflow:hidden;
    animation:rise .35s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  #card::after{
    content:"Rx";
    position:absolute; top:-14px; right:14px;
    font-family:Georgia,serif; font-size:90px; font-weight:700; font-style:italic;
    color:var(--teal); opacity:.06; line-height:1; pointer-events:none;
  }

  .q-tag{
    font-family:"Consolas","IBM Plex Mono",monospace; font-size:11px; color:var(--teal-deep);
    background:var(--teal-soft); padding:4px 10px; border-radius:20px;
    align-self:flex-start; margin-bottom:16px; letter-spacing:.2px;
  }
  .question-text{
    font-family:Georgia,"Noto Serif Thai",serif;
    font-size:25px; font-weight:700; line-height:1.4; position:relative; z-index:1;
  }
  .answer-wrap{
    margin-top:20px; padding-top:18px;
    border-top:1px dashed var(--line);
    position:relative; z-index:1;
  }
  .answer-text{
    font-size:14.5px; line-height:1.7; color:#2b3a33;
    max-height:340px; overflow-y:auto; padding-right:8px;
  }
  .answer-text::-webkit-scrollbar{width:5px;}
  .answer-text::-webkit-scrollbar-thumb{background:rgba(23,45,35,.18); border-radius:3px;}


  /* ---- structured answer rows ---- */
  .row{ display:grid; grid-template-columns:104px 1fr; gap:10px; padding:7px 0; }
  .row + .row{ border-top:1px solid rgba(23,45,35,.07); }
  .row .k{
    font-size:11.5px; font-weight:700; letter-spacing:.2px;
    color:var(--teal-deep); background:var(--teal-soft);
    border-radius:6px; padding:3px 8px; height:fit-content;
    text-align:center; white-space:nowrap;
  }
  .row.warn .k{ color:#8a3d13; background:var(--rust-soft); }
  .row .v{ font-size:14px; line-height:1.72; }
  .row .v b{ color:var(--teal-deep); font-weight:700; }
  .row.warn .v b{ color:var(--rust); }
  .btn-row{margin-top:auto; padding-top:24px; display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1;}
  .btn-row button{
    flex:1; min-width:120px; border:none; border-radius:12px;
    padding:13px 16px; font-family:inherit;
    font-size:14.5px; font-weight:600; cursor:pointer;
    transition:transform .12s ease, filter .15s ease; color:#fff;
  }
  .btn-row button:hover{transform:translateY(-1px); filter:brightness(1.06);}
  .btn-row button:active{transform:translateY(0);}
  #show-btn{background:var(--teal-deep);}
  #right-btn{background:var(--teal);}
  #wrong-btn{background:var(--rust);}

  @media (max-width:520px){
    .question-text{font-size:21px;}
    #card{padding:26px 20px 22px;}
    .row{ grid-template-columns:1fr; gap:3px; }
    .row .k{ justify-self:start; }
  }
</style>
</head>
<body>

<div id="topbar">
  <a id="back-btn" href="index.html" aria-label="กลับไปหน้าเมนูเด็ค">&#8592; เมนู</a>
  <div id="brand">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="9" width="20" height="6" rx="3" transform="rotate(-45 12 12)" fill="#1f6f54"/>
      <path d="M12 12 L18.5 5.5" stroke="#eef1e9" stroke-width="1.5"/>
      <rect x="2" y="9" width="20" height="6" rx="3" transform="rotate(-45 12 12)" fill="none" stroke="#12503b" stroke-width="1"/>
    </svg>
    <div>
      <h1>Antimicrobial Flashcards</h1>
      <span>ท่องจำยาต้านจุลชีพ 76 ตัว (ฉบับภาษาไทยเข้าใจง่าย)</span>
    </div>
  </div>
  <button id="restart-btn">รีเซ็ตสถิติ ↻</button>
</div>

<div id="stats">
  <span class="stat-pill">ทวนไปแล้ว <b id="stat-total">0</b> ใบ</span>
  <span class="stat-pill">ตอบถูก <b id="stat-right">0</b></span>
  <span class="stat-pill">ตอบผิด <b id="stat-wrong">0</b></span>
</div>

<div id="mastery">
  <div class="label"><span>ระดับความชำนาญโดยรวม</span><span id="mastery-pct">–</span></div>
  <div class="track"><div class="fill" id="mastery-fill"></div></div>
</div>

<div id="card">
  <div id="question">
    <span class="q-tag" id="q-tag">ยาทั้งหมด</span>
    <div class="question-text" id="q-text"></div>
  </div>
  <div class="answer-wrap" id="answer" style="display:none;">
    <div class="answer-text" id="a-text"></div>
  </div>
  <div class="btn-row">
    <button id="show-btn">เฉลย (Show)</button>
    <button id="right-btn" style="display:none;">ตอบถูก ✓</button>
    <button id="wrong-btn" style="display:none;">ตอบผิด ✕</button>
  </div>
</div>

<script>
const RAW = [];
function add(name, o){ o.name = name; RAW.push(o); }

const PEN_ADR  = "ผื่น, แพ้รุนแรง (anaphylaxis), อาการทางเดินอาหาร, ไตอักเสบ";
const PEN_B    = "Pregnancy category B — ใช้ได้ค่อนข้างปลอดภัย และให้นมบุตรได้";
const CIDAL_T  = "ยับยั้งการสร้างผนังเซลล์ • ฆ่าเชื้อ (bactericidal) • ประสิทธิภาพขึ้นกับ<b>ระยะเวลา</b>ที่ระดับยาสูงกว่า MIC (time-dependent)";
const CEPH_ADR = "ภูมิแพ้ยา, อาการทางเดินอาหาร, ไตอักเสบ";

/* ---------- Natural penicillins ---------- */
add("Penicillin G (Benzylpenicillin)", {
  group:"Natural penicillin (β-lactam)", mech:CIDAL_T,
  spectrum:"แคบ — แกรมบวกรูปกลม (Streptococci, Staphylococci ที่ไวยา, Pneumococcus), Bacillus anthracis, Corynebacterium diphtheriae, Listeria spp., Treponema pallidum และ anaerobe ยกเว้น Bacteroides fragilis • <b>ไม่ทน</b> β-lactamase",
  pk:"ผ่าน BBB ได้น้อย (ดีขึ้นเมื่อมีเยื่อหุ้มสมองอักเสบ) • ผ่านรกได้ • จับโปรตีน ~60% • ให้ IV/IM; มีรูป benzathine และ procaine ออกฤทธิ์ยาวสำหรับฉีด IM",
  uses:"ติดเชื้อ Streptococcus, เยื่อบุหัวใจอักเสบ, เยื่อหุ้มสมองอักเสบจาก meningococcus, คอตีบ, ซิฟิลิส",
  adr:PEN_ADR, note:PEN_B });

add("Penicillin V (Phenoxymethylpenicillin)", {
  group:"Natural penicillin ชนิดกิน (β-lactam)", mech:CIDAL_T,
  spectrum:"แคบ ใกล้เคียง Penicillin G — แกรมบวก, spirochete และ anaerobe บางชนิด • <b>ไม่ทน</b> β-lactamase",
  pk:"ยาไม่คงตัวในกรด — กินก่อนอาหาร 1 ชม. หรือหลังอาหาร 2 ชม.",
  uses:"ติดเชื้อ Streptococcus และเชื้ออื่นที่ไวต่อ penicillin",
  adr:PEN_ADR, note:PEN_B });

/* ---------- Penicillinase-resistant (anti-staph) ---------- */
const ARS_G  = "Penicillinase-resistant penicillin (anti-staphylococcal)";
const ARS_S  = "แคบ — MSSA, Staphylococcus epidermidis และ Streptococci บางชนิด • <b>ทน</b> penicillinase จาก Staphylococcus";
const ARS_PK = "ผ่าน BBB / CSF ได้น้อย → <b>ไม่ใช้</b>รักษาเยื่อหุ้มสมองอักเสบ";
["Cloxacillin","Dicloxacillin","Oxacillin","Flucloxacillin","Nafcillin"].forEach(function(n){
  add(n, { group:ARS_G, mech:CIDAL_T, spectrum:ARS_S, pk:ARS_PK,
    uses:"ติดเชื้อผิวหนัง และการติดเชื้อ Staphylococcus ที่ไวต่อยา", adr:PEN_ADR });
});
add("Methicillin", {
  group:ARS_G, mech:CIDAL_T,
  spectrum:ARS_S + " • เป็นตัวนิยาม MSSA (methicillin-susceptible S. aureus)",
  pk:ARS_PK, uses:"ปัจจุบันใช้อ้างอิงทางห้องปฏิบัติการเป็นหลัก", adr:PEN_ADR,
  note:"การดื้อยาใน MRSA เกิดจาก PBP2a ที่เปลี่ยนแปลงไป" });

/* ---------- Aminopenicillins ---------- */
add("Amoxicillin", {
  group:"Aminopenicillin (broad-spectrum β-lactam)", mech:CIDAL_T,
  spectrum:"หมู่ amino ประจุบวกช่วยให้ผ่าน porin ของแกรมลบได้ดีขึ้น → ครอบคลุม Streptococci ที่ไวต่อ penicillin, S. viridans, Enterococcus spp. และแกรมลบได้กว้างกว่า natural penicillin • <b>ไม่ทน</b> β-lactamase",
  pk:"รูปแบบกิน",
  uses:"หู คอ จมูก, ติดเชื้อทางเดินหายใจส่วนล่าง, ทางเดินปัสสาวะและอวัยวะสืบพันธุ์, ผิวหนัง",
  adr:PEN_ADR, note:PEN_B });

add("Ampicillin", {
  group:"Aminopenicillin (broad-spectrum β-lactam)", mech:CIDAL_T,
  spectrum:"Streptococci ที่ไวต่อยา, S. viridans, Enterococcus spp. และแกรมลบกว้างขึ้น • <b>ไม่ทน</b> β-lactamase",
  pk:"ให้ได้ทั้งกินและ IV",
  uses:"หู คอ จมูก, ทางเดินหายใจส่วนล่าง, ทางเดินปัสสาวะและอวัยวะสืบพันธุ์, ผิวหนัง",
  adr:PEN_ADR, note:PEN_B });

/* ---------- Antipseudomonal penicillins ---------- */
const APS_G = "Antipseudomonal penicillin (β-lactam spectrum กว้าง)";
const APS_U = "ทางเดินปัสสาวะ, อุ้งเชิงกรานอักเสบ, ผิวหนังและเนื้อเยื่อ, ติดเชื้อในกระแสเลือด, ปอดอักเสบ, กระดูกอักเสบ";
[["Carbenicillin",""],["Ticarcillin",""],["Azlocillin",""],
 ["Piperacillin"," • มักใช้ร่วมกับ tazobactam"],["Mezlocillin",""]].forEach(function(p){
  add(p[0], { group:APS_G, mech:CIDAL_T,
    spectrum:"แกรมลบชนิด aerobe ที่ดื้อยา รวมถึง <b>Pseudomonas</b>" + p[1],
    uses:APS_U, adr:PEN_ADR });
});

/* ---------- β-lactamase inhibitors ---------- */
add("Clavulanic acid", {
  group:"β-lactamase inhibitor (ชนิดผันกลับไม่ได้)",
  mech:"โครงสร้างคล้าย β-lactam เข้าไปจับเอนไซม์แทน จึงปกป้องยาคู่จากการถูกทำลาย",
  spectrum:"ไม่ใช้เดี่ยวเป็นยาฆ่าเชื้อ", pk:"กินหรือ IV",
  uses:"จับคู่กับ amoxicillin เพื่อขยายฤทธิ์ครอบคลุมเชื้อที่สร้าง β-lactamase" });

add("Sulbactam", {
  group:"β-lactamase inhibitor (ชนิดผันกลับไม่ได้)",
  mech:"จับเอนไซม์ β-lactamase ปกป้องยาคู่", spectrum:"ไม่ใช้เดี่ยว", pk:"กินหรือ IV",
  uses:"จับคู่กับ ampicillin • เพิ่มฤทธิ์ต่อ <b>Acinetobacter baumannii</b>" });

add("Tazobactam", {
  group:"β-lactamase inhibitor (ชนิดผันกลับไม่ได้)",
  mech:"จับเอนไซม์ β-lactamase ปกป้องยาคู่", spectrum:"ไม่ใช้เดี่ยว", pk:"ให้ IV",
  uses:"จับคู่กับ piperacillin (สูตรกว้างที่สุดในกลุ่ม ครอบคลุมแกรมบวก แกรมลบ และ anaerobe) • และจับคู่กับ ceftolozane เพื่อคุม Pseudomonas และ ESBL" });

add("Avibactam", {
  group:"β-lactamase inhibitor รุ่นใหม่ (non-β-lactam, ผันกลับได้)",
  mech:"จับเอนไซม์ β-lactamase ปกป้องยาคู่", spectrum:"ไม่ใช้เดี่ยว", pk:"ให้ IV" });

/* ---------- Combinations ---------- */
add("Amoxicillin-clavulanate", {
  group:"Aminopenicillin + β-lactamase inhibitor", mech:CIDAL_T,
  spectrum:"กว้างกว่า amoxicillin เดี่ยว — ครอบคลุมเชื้อที่สร้าง β-lactamase",
  uses:"ทางเดินหายใจ, หูชั้นกลางอักเสบ, ไซนัสอักเสบ, ผิวหนังและเนื้อเยื่ออ่อน, ทางเดินปัสสาวะ",
  adr:PEN_ADR, note:"ตัวเลือกหลักสำหรับติดเชื้อทางเดินหายใจในชุมชน" });

add("Ampicillin-sulbactam", {
  group:"Aminopenicillin + β-lactamase inhibitor", mech:CIDAL_T,
  spectrum:"กว้างกว่า amoxicillin-clavulanate • เพิ่มฤทธิ์ต่อ <b>Acinetobacter baumannii</b>",
  uses:"ทางเลือกสำหรับติดเชื้อ anaerobe", adr:PEN_ADR });

add("Piperacillin-tazobactam", {
  group:"Antipseudomonal penicillin + β-lactamase inhibitor", mech:CIDAL_T,
  spectrum:"<b>กว้างที่สุดในกลุ่ม</b> — แกรมบวก, แกรมลบ (รวม Pseudomonas) และ anaerobe",
  uses:"ติดเชื้อรุนแรงหลายเชื้อร่วมกัน • ตัวเลือกแรกสำหรับ P. aeruginosa", adr:PEN_ADR });

/* ---------- Cephalosporins ---------- */
add("Cephalexin", { group:"Cephalosporin รุ่นที่ 1 (กิน)", mech:CIDAL_T,
  spectrum:"แกรมบวกดี + แกรมลบบางชนิด • spectrum ค่อนข้างแคบ", adr:CEPH_ADR, note:PEN_B });
add("Cefazolin", { group:"Cephalosporin รุ่นที่ 1 (IV)", mech:CIDAL_T,
  spectrum:"แกรมบวกดี + แกรมลบบางชนิด", adr:CEPH_ADR, note:PEN_B });
add("Cefuroxime", { group:"Cephalosporin รุ่นที่ 2 (IV)", mech:CIDAL_T,
  spectrum:"แกรมลบกว้างขึ้นกว่ารุ่นที่ 1", pk:"<b>รุ่นที่ 2 ตัวเดียวที่ผ่าน BBB ได้</b>",
  adr:CEPH_ADR, note:"Pregnancy category B" });
add("Cefaclor", { group:"Cephalosporin รุ่นที่ 2 (กิน)", mech:CIDAL_T,
  spectrum:"แกรมลบกว้างขึ้นกว่ารุ่นที่ 1", adr:CEPH_ADR, note:"Pregnancy category B" });
add("Ceftriaxone", { group:"Cephalosporin รุ่นที่ 3 (IV)", mech:CIDAL_T,
  spectrum:"กว้าง เด่นที่แกรมลบ", pk:"<b>ผ่านเข้า CSF ได้ดีที่สุดในกลุ่ม</b>",
  uses:"ตัวเลือกแรกสำหรับเยื่อหุ้มสมองอักเสบ", adr:CEPH_ADR, note:"Pregnancy category B" });
add("Ceftazidime", { group:"Cephalosporin รุ่นที่ 3", mech:CIDAL_T,
  spectrum:"แกรมลบกว้าง + มีฤทธิ์ต่อ <b>Pseudomonas</b>",
  uses:"ตัวเลือกแรกสำหรับ P. aeruginosa", adr:CEPH_ADR });
add("Cefotaxime", { group:"Cephalosporin รุ่นที่ 3 (IV)", mech:CIDAL_T,
  spectrum:"กว้าง รวมแกรมลบ", uses:"ทางเลือกสำหรับเยื่อหุ้มสมองอักเสบ",
  adr:CEPH_ADR, note:"Pregnancy category B" });
add("Cefepime", { group:"Cephalosporin รุ่นที่ 4 (IV)", mech:CIDAL_T,
  spectrum:"แกรมบวกและแกรมลบดีเยี่ยมทั้งคู่",
  uses:"ติดเชื้อรุนแรง • พิจารณาใช้กับแกรมลบที่ดื้อยา", adr:CEPH_ADR });
add("Ceftaroline", { group:"Cephalosporin รุ่นที่ 5", mech:CIDAL_T,
  spectrum:"จุดเด่นคือมีฤทธิ์ต่อ <b>MRSA</b>", adr:CEPH_ADR });
add("Ceftobiprole", { group:"Cephalosporin รุ่นที่ 5", mech:CIDAL_T,

  adr:SULF_ADR + ", kernicterus",
  note:"อาจเกิดผลึกในปัสสาวะ — ดื่มน้ำมาก ๆ • Pregnancy category C" });

/* ---------- Misc ---------- */
add("Metronidazole", { group:"Nitroimidazole",
  mech:"ทำลายโครงสร้างเกลียวของ DNA • ฆ่าเชื้อ (bactericidal)",
  spectrum:"<b>anaerobe</b> และโปรโตซัว",
  pk:"ชีวปริมาณออกฤทธิ์ทางปาก ~80% • จับโปรตีน &lt;20% • กระจายตัวกว้าง <b>ผ่านเข้า CSF ในระดับรักษาได้</b> และซึมเข้าฝีหนองได้ดี • ผ่านตับ ยับยั้ง CYP2C9 • ค่าครึ่งชีวิต ~8 ชม. (นานขึ้นเมื่อตับบกพร่อง) • ขับทางปัสสาวะเป็นหลัก",

  adr:"<b>ปฏิกิริยาคล้าย disulfiram เมื่อดื่มแอลกอฮอล์</b>, ปัสสาวะสีเข้ม",
  note:"<b>งดแอลกอฮอล์</b>ระหว่างและหลังใช้ยา • Pregnancy category B" });

  mech:"ทำให้ DNA ของแบคทีเรียเสียหาย • ยับยั้งการเจริญ (bacteriostatic)",

  mech:"ทำให้เยื่อหุ้มเซลล์แบคทีเรียทำงานผิดปกติ", spectrum:"แกรมบวก",

add("Polymyxins", { group:"Polymyxin (ออกฤทธิ์ที่เยื่อหุ้มเซลล์)",

  note:"กลไกดื้อยาเกี่ยวข้องกับการดัดแปลงเยื่อหุ้มเซลล์ผ่านระบบ <b>PhoP-PhoQ</b> • เอกสารต้นฉบับไม่ได้ระบุรายชื่อยารายตัว" });

/* ---------- การแสดงผลคำตอบเป็นหัวข้อ ---------- */
const FIELDS = [
  ["group",    "กลุ่ม",        false],
  ["mech",     "กลไก",         false],
  ["spectrum", "ครอบคลุม",     false],
  ["pk",       "PK / การใช้",  false],
  ["uses",     "ข้อบ่งใช้",     false],
  ["adr",      "ผลข้างเคียง",  true ],
  ["note",     "ข้อควรจำ",     true ]
];

function renderAnswer(card){
  var html = "";
  for (var i = 0; i < FIELDS.length; i++){
    var key = FIELDS[i][0], label = FIELDS[i][1], warn = FIELDS[i][2];
    var val = card[key];
    if (!val) continue;
    html += '<div class="row' + (warn ? ' warn' : '') + '">'
          +   '<div class="k">' + label + '</div>'
          +   '<div class="v">' + val + '</div>'
          + '</div>';
  }
  return html;
}

function freshDeck(){
  return RAW.map(function(d){
    var c = {};
    for (var k in d) c[k] = d[k];
    c.weight = 1;
    return c;
  });
}

let cards = freshDeck();

const MIN_W = 0.25;
const MAX_W = 12;

let totalShown = 0;
let totalRight = 0;
let totalWrong = 0;
let current = null;
let prev = null;

function pickNext(){
  var totalWeight = cards.reduce(function(s,c){ return s + c.weight; }, 0);
  var card;
  var tries = 0;
  do {
    var r = Math.random() * totalWeight;
    var acc = 0;
    for(var i=0;i<cards.length;i++){
      acc += cards[i].weight;
      if(r <= acc){ card = cards[i]; break; }
    }
    tries++;
  } while(cards.length > 1 && card === prev && tries < 20);
  return card;
}

function renderStats(){
  document.getElementById('stat-total').textContent = totalShown;
  document.getElementById('stat-right').textContent = totalRight;
  document.getElementById('stat-wrong').textContent = totalWrong;

  var attempts = totalRight + totalWrong;
  var pctEl = document.getElementById('mastery-pct');
  var fillEl = document.getElementById('mastery-fill');
  if(attempts === 0){
    pctEl.textContent = '–';
    fillEl.style.width = '0%';
  } else {
    var pct = Math.round((totalRight / attempts) * 100);
    pctEl.textContent = pct + '%';
    fillEl.style.width = pct + '%';
  }
}

function nextCard(){
  prev = current;
  current = pickNext();
  totalShown++;
  renderStats();

  document.getElementById('q-tag').textContent = 'ยาทั้งหมด ' + cards.length + ' ตัว · ใบที่ ' + totalShown;
  document.getElementById('q-text').textContent = current.name;
  document.getElementById('a-text').innerHTML = renderAnswer(current);

  document.getElementById('answer').style.display = 'none';
  document.getElementById('show-btn').style.display = 'inline-block';
  document.getElementById('right-btn').style.display = 'none';
  document.getElementById('wrong-btn').style.display = 'none';

  var cardEl = document.getElementById('card');
  cardEl.style.animation = 'none';
  void cardEl.offsetWidth;
  cardEl.style.animation = 'rise .35s ease';
}

document.getElementById('show-btn').onclick = function(){
  document.getElementById('answer').style.display = 'block';
  document.getElementById('show-btn').style.display = 'none';
  document.getElementById('right-btn').style.display = 'inline-block';
  document.getElementById('wrong-btn').style.display = 'inline-block';
};

document.getElementById('right-btn').onclick = function(){
  totalRight++;
  current.weight = Math.max(current.weight * 0.5, MIN_W);
  nextCard();
};

document.getElementById('wrong-btn').onclick = function(){
  totalWrong++;
  current.weight = Math.min(current.weight * 2.5, MAX_W);
  nextCard();
};

document.getElementById('restart-btn').onclick = function(){
  cards = freshDeck();
  totalShown = 0; totalRight = 0; totalWrong = 0;
  current = null; prev = null;
  nextCard();
};

nextCard();
</script>
