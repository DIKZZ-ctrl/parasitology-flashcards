<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedRecall · Flashcard Decks</title>
<style>
  :root{ --bg:#eef1e9; --paper:#fffdf8; --ink:#182420; --sub:#5c6b62; --line:#dde3d5; --teal:#1f6f54; --teal-deep:#12503b; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Leelawadee UI","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:48px 20px;
  }
  h1{ font-family:Georgia,"Noto Serif Thai",serif; font-size:24px; color:var(--teal-deep); margin:0 0 6px; }
  p.sub{ color:var(--sub); font-size:13px; margin:0 0 28px; }
  .deck-list{ width:100%; max-width:480px; display:flex; flex-direction:column; gap:14px; }
  .deck-link{
    display:block; background:var(--paper); border:1px solid var(--line); border-left:5px solid var(--teal);
    border-radius:14px; padding:18px 20px; text-decoration:none; color:var(--ink);
    box-shadow:0 1px 2px rgba(23,45,35,.04), 0 10px 22px -16px rgba(23,45,35,.25);
    transition:transform .12s ease;
  }
  .deck-link:hover{ transform:translateY(-2px); }
  .deck-link .name{ font-weight:700; font-size:16px; }
  .deck-link .desc{ font-size:12.5px; color:var(--sub); margin-top:4px; }
  .empty, .err{ color:var(--sub); font-size:13px; text-align:center; }
</style>
</head>
<body>
  <h1>MedRecall Flashcard Decks</h1>
  <p class="sub">เลือกเด็คที่จะทวน</p>
  <div class="deck-list" id="deckList">
    <div class="empty">กำลังโหลดรายการ…</div>
  </div>

<script>
/*
  Deck list is generated automatically from the files in this repo, so a new
  .html file added to the repo root shows up here without editing this page.
  Known files get a curated Thai name/description below; anything new falls
  back to a title made from the filename.
*/
const KNOWN = {
  "flashcards_pro.html": { name: "Parasitology", desc: "โปรโตซัว หนอนพยาธิ แมลง — 32 ใบ" },
  "antiviral-antifungal-antiparasitic.html": { name: "Antiviral / Antifungal / Antiparasitic", desc: "ยาต้านไวรัส เชื้อรา ปรสิต — 42 ใบ" },
  "antibiotics.html": { name: "Antimicrobial", desc: "ยาต้านจุลชีพ (แบคทีเรีย) — 76 ใบ" },
  "dermpath.html": { name: "EXAM SKIN SUMET MODULE 185", desc: "ข้อสอบข้อกาพร้อมเฉลยละเอียด" },
  "dermpath_exam.html": { name: "Dermatopathology Exam", desc: "ข้อสอบข้อกาพร้อมเฉลยละเอียด" },
  "pathology-bone-joint-soft-tissue-tumor-exam.html": { name: "Bone, Joint & Soft Tissue Tumor Pathology", desc: "ข้อสอบข้อกาพร้อมเฉลยละเอียด" }
};

function titleFromFilename(filename){
  return filename
    .replace(/\.html?$/i, "")
    .replace(/[-_]+/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function loadDecks(){
  const listEl = document.getElementById("deckList");
  const owner = "DIKZZ-ctrl";
  const repo = "parasitology-flashcards";

  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`, {
      headers: { "Accept": "application/vnd.github+json" }
    });
    if (!res.ok) throw new Error("GitHub API " + res.status);
    const items = await res.json();

    const decks = items
      .filter(it => it.type === "file" && /\.html?$/i.test(it.name) && it.name.toLowerCase() !== "index.html")
      .sort((a, b) => a.name.localeCompare(b.name));

    if (decks.length === 0){
      listEl.innerHTML = '<div class="empty">ยังไม่มีเด็คในตอนนี้</div>';
      return;
    }

    listEl.innerHTML = decks.map(function(it){
      const meta = KNOWN[it.name] || { name: titleFromFilename(it.name), desc: "" };
      return (
        '<a class="deck-link" href="' + it.name + '">' +
          '<div class="name">' + meta.name + '</div>' +
          (meta.desc ? '<div class="desc">' + meta.desc + '</div>' : '') +
        '</a>'
      );
    }).join("");
  } catch (err) {
    // Fallback: GitHub API unreachable (rate-limited, offline, etc.) — show the known decks statically.
    listEl.innerHTML = Object.keys(KNOWN).map(function(filename){
      const meta = KNOWN[filename];
      return (
        '<a class="deck-link" href="' + filename + '">' +
          '<div class="name">' + meta.name + '</div>' +
          '<div class="desc">' + meta.desc + '</div>' +
        '</a>'
      );
    }).join("") + '<div class="err">(โหลดรายการล่าสุดจาก GitHub ไม่สำเร็จ — แสดงรายการที่บันทึกไว้แทน)</div>';
  }
}

loadDecks();
</script>
</body>
</html>
